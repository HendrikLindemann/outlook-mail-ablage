# Prüft das Manifest beim Validierungsdienst von Microsoft.
name: Validate manifest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ADDIN_BASE_URL: https://hendriklindemann.github.io/outlook-mail-ablage
      - run: npx office-addin-manifest validate dist/manifest.xml
      - run: npx office-addin-manifest validate -p dist/manifest.xml
        if: always()
